permissions:
  contents: read
  packages: write

name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: Vars
      id: vars
      run: |
        echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
  
    - name: Build image
      run: |
        docker build . --file Dockerfile \
          --tag ghcr.io/sampozki/bottov2:latest \
          --tag ghcr.io/sampozki/bottov2:${SHORT_SHA}
        docker images

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push the image to ghcr
      run: |
        docker push ghcr.io/sampozki/bottov2:latest
        docker push ghcr.io/sampozki/bottov2:${SHORT_SHA}
